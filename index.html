  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #9bb7a5;outline-offset:2px}.app{max-width:820px;margin:auto;padding:0 24px 110px}.top{display:flex;align-items:center;justify-content:space-between;padding:25px 0 22px}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border-radius:12px;background:#dfe9df;color:var(--green);display:grid;place-items:center;font-size:20px;font-weight:600}.brand-name{font-size:17px;letter-spacing:-.04em;font-weight:600}.top-note{font-size:12px;color:var(--muted)}
    .intro{padding:23px 0 21px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(30px,7vw,47px);line-height:1.06;letter-spacing:-.055em;font-weight:550;margin:12px 0 10px}.intro p{margin:0;color:#70756e;font-size:15px;line-height:1.55;max-width:500px}.workspace{margin-top:20px}.mode-label{font-size:13px;font-weight:600;margin:0 0 12px}.entry{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px 16px 13px;box-shadow:var(--shadow)}textarea{resize:vertical;width:100%;min-height:104px;border:0;background:transparent;color:var(--ink);font-size:19px;line-height:1.55;outline:none;padding:4px 2px}textarea::placeholder{color:#b0b4ad}.entry-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{color:var(--muted);font-size:12px}.primary{border:0;border-radius:999px;background:#273c30;color:white;padding:11px 18px;font-size:13px;font-weight:600;min-height:43px}.primary:disabled{opacity:.48}.result{margin-top:18px}.result-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.korean{font-size:34px;letter-spacing:-.055em;line-height:1.25}.roman{font-size:15px;color:var(--green);margin-top:5px}.meaning{font-size:17px;line-height:1.45;margin-top:18px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{background:#f1f2ed;color:#646a62;border-radius:999px;padding:6px 10px;font-size:11px}.audio{border:1px solid var(--line);background:white;color:var(--green);width:42px;height:42px;border-radius:50%;font-size:18px;flex:none}.section-title{font-size:12px;font-weight:650;color:#797e77;margin:18px 0 9px}.example{border-top:1px solid var(--line);padding:12px 0 2px}.example .ko{font-size:16px;line-height:1.5}.example .en{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}.notice{font-size:12px;line-height:1.5;color:var(--muted);padding:10px 2px}.status{font-size:13px;color:var(--muted);padding:10px 2px}.error{color:#a55a46}.options{display:grid;gap:10px;margin-top:15px}.option{border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px}.option-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.option-title{font-size:12px;font-weight:650;color:var(--green)}.option .korean{font-size:24px;margin-top:8px}.option .roman{font-size:13px}.option p{font-size:13px;line-height:1.5;color:#6e736c;margin:10px 0 0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.seg{display:flex;background:#eeefea;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:12px;color:#747971}.seg button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0000000b}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#f7f7f4eF;backdrop-filter:blur(20px);border-top:1px solid #e7e8e2;padding:8px max(18px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);max-width:820px;margin:auto}.tab{border:0;background:transparent;color:#92968f;padding:7px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-height:49px}.tab .ico{font-size:19px;line-height:1}.tab.active{color:var(--green);font-weight:650}.rule-list{display:grid;gap:10px;margin-top:15px}.rule{border:1px solid var(--line);border-radius:18px;background:white;padding:16px}.rule h3{font-size:15px;margin:0 0 7px;letter-spacing:-.02em}.rule p{font-size:13px;line-height:1.55;color:#737970;margin:0}.rule-example{margin-top:12px;padding:11px 12px;background:#f5f6f2;border-radius:13px;font-size:14px;line-height:1.55}.rule-example span{color:var(--green);font-size:12px}.question-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.question-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;color:#555c54}.small{font-size:11px;color:var(--muted);line-height:1.5}.empty{background:#eff3ee;border-radius:18px;padding:16px;color:#59635a;font-size:13px;line-height:1.5}
    @media(min-width:680px){.app{padding:0 46px 70px}.top{padding-top:32px}.intro{padding-top:30px}.workspace{margin-top:25px}.result-card{padding:25px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{position:sticky;bottom:12px;border:1px solid var(--line);border-radius:18px;padding:5px;margin:30px auto 0;box-shadow:0 8px 30px #18251c0c}.app{padding-bottom:25px}}
    @media(max-width:380px){.app{padding-left:17px;padding-right:17px}.top-note{display:none}.entry{padding:13px}.hint{font-size:11px}.primary{padding:10px 14px}}
    @media(prefers-reduced-motion:no-preference){button,.result-card{transition:transform .16s ease,background-color .16s ease}button:active{transform:scale(.98)}}

</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="mark" aria-hidden="true">ㅎ</div><div class="brand-name">haneul</div></div><div class="top-note">A little clearer, every day.</div></header>
    <section class="intro"><div class="eyebrow">Korean, at your pace</div><h1 id="headline">Find the words<br>you’re looking for.</h1><p id="subhead">Look up a Korean word, shape a translation, or ask why a sound changes.</p></section>
    <div id="view"></div>
    <nav class="tabs" aria-label="Main navigation"><button class="tab active" data-tab="lookup"><span class="ico">⌕</span><span>Look up</span></button><button class="tab" data-tab="translate"><span class="ico">⇄</span><span>Translate</span></button><button class="tab" data-tab="questions"><span class="ico">？</span><span>Questions</span></button></nav>
  </main>
  <script>
  (()=>{
    const view=document.getElementById('view'), headline=document.getElementById('headline'), subhead=document.getElementById('subhead');
    let tab='lookup', lang='en', lastText='', cache={};
    const bank={
      '안녕':{roman:'annyeong',meaning:'hello; hi; peace',examples:[['안녕하세요.','Hello. (polite)'],['친구에게 안녕이라고 했어요.','I said hi to my friend.']]},
      '사랑':{roman:'sarang',meaning:'love; affection',examples:[['사랑은 서로를 이해하는 거예요.','Love is understanding one another.'],['가족을 사랑해요.','I love my family.']]},
      '사랑하다':{roman:'saranghada',meaning:'to love; to care for',examples:[['저는 한국어를 사랑해요.','I love Korean.']]},
      '보고 싶다':{roman:'bogo sipda',meaning:'to miss someone; to want to see',examples:[['가족이 보고 싶어요.','I miss my family.'],['친구를 보고 싶어.','I miss my friend. (casual)']]},
      '도와주다':{roman:'dowajuda',meaning:'to help; to give someone help',examples:[['도와주셔서 감사합니다.','Thank you for helping me.'],['제가 도와드릴까요?','Would you like me to help? (polite)']]},
      '괜찮아요':{roman:'gwaenchanayo',meaning:'It’s okay; I’m fine; no thanks',examples:[['이제 괜찮아요.','I’m okay now.'],['도움이 필요하세요? — 괜찮아요.','Do you need help? — I’m okay, thanks.']]},
      '학교':{roman:'hakgyo',meaning:'school',examples:[['학교에 가요.','I’m going to school.']]},
      '한국어':{roman:'hangugeo',meaning:'Korean language',examples:[['한국어를 공부하고 있어요.','I’m studying Korean.']]},
      '고마워요':{roman:'gomawoyo',meaning:'thank you; I’m grateful (polite)',examples:[['도와줘서 고마워요.','Thank you for helping me.']]},
      '미안해요':{roman:'mianhaeyo',meaning:'I’m sorry (polite, conversational)',examples:[['늦어서 미안해요.','I’m sorry I’m late.']]},
      '밥':{roman:'bap',meaning:'cooked rice; a meal',examples:[['밥 먹었어요?','Have you eaten?'],['밥을 같이 먹을까요?','Shall we eat together?']]}
    };
    const phrases={
      'i miss you':[{ko:'보고 싶어',roman:'bogo sipeo',tag:'Casual',note:'Warm and intimate. Use with a close friend, partner, or someone younger.'},{ko:'보고 싶어요',roman:'bogo sipeoyo',tag:'Polite',note:'A natural, everyday polite way to say “I miss you.”'},{ko:'그리워요',roman:'geuriwoyo',tag:'Gentle · polite',note:'More wistful or tender; often used for someone or somewhere you long for.'}],
      '我想你了':[{ko:'보고 싶어',roman:'bogo sipeo',tag:'Casual',note:'Warm and intimate; for a close friend, partner, or someone younger.'},{ko:'보고 싶어요',roman:'bogo sipeoyo',tag:'Polite',note:'Natural and polite in everyday conversation.'},{ko:'그리워요',roman:'geuriwoyo',tag:'Gentle · polite',note:'More wistful or tender, like “I long for you.”'}],
      '我想你':[{ko:'보고 싶어',roman:'bogo sipeo',tag:'Casual',note:'Warm and intimate; for someone close.'},{ko:'보고 싶어요',roman:'bogo sipeoyo',tag:'Polite',note:'Natural and polite in everyday conversation.'},{ko:'그리워요',roman:'geuriwoyo',tag:'Gentle · polite',note:'A more wistful way to express longing.'}],
      'do you need help':[{ko:'도움이 필요하세요?',roman:'doumi piryohaseyo?',tag:'Polite',note:'A considerate, natural way to offer help to someone you don’t know well.'},{ko:'도와드릴까요?',roman:'dowadeurilkkayo?',tag:'Polite · service',note:'“Shall I help you?” Often used when actively offering assistance.'},{ko:'도움 필요해?',roman:'doum piryohae?',tag:'Casual',note:'Use with close friends or someone younger.'}],
      '你有沒有要幫忙':[{ko:'도움이 필요하세요?',roman:'doumi piryohaseyo?',tag:'Polite',note:'A considerate way to ask if someone needs help.'},{ko:'도와드릴까요?',roman:'dowadeurilkkayo?',tag:'Polite · service',note:'“Shall I help you?” A natural offer of assistance.'},{ko:'도움 필요해?',roman:'doum piryohae?',tag:'Casual',note:'Use with a close friend or someone younger.'}],
      '你有没有要帮忙':[{ko:'도움이 필요하세요?',roman:'doumi piryohaseyo?',tag:'Polite',note:'A considerate way to ask if someone needs help.'},{ko:'도와드릴까요?',roman:'dowadeurilkkayo?',tag:'Polite · service',note:'“Shall I help you?” A natural offer of assistance.'},{ko:'도움 필요해?',roman:'doum piryohae?',tag:'Casual',note:'Use with a close friend or someone younger.'}],
      'thank you':[{ko:'고마워',roman:'gomawo',tag:'Casual',note:'For friends, family, or someone younger.'},{ko:'고마워요',roman:'gomawoyo',tag:'Polite',note:'Friendly and polite in everyday conversation.'},{ko:'감사합니다',roman:'gamsahamnida',tag:'Formal',note:'More formal and respectful; common at work or with strangers.'}],
      'hello':[{ko:'안녕',roman:'annyeong',tag:'Casual',note:'For friends and people you are close to.'},{ko:'안녕하세요',roman:'annyeonghaseyo',tag:'Polite',note:'The standard polite everyday greeting.'},{ko:'안녕하십니까',roman:'annyeonghasimnikka',tag:'Formal',note:'Very formal; often used in speeches or official settings.'}]
    };
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function romanize(s){let out='';for(const ch of s){const code=ch.charCodeAt(0)-44032;if(code<0||code>11171){out+=ch;continue}const i=Math.floor(code/588),m=Math.floor((code%588)/28),f=code%28;const initials=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];const medials=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];const finals=['','k','k','k','n','n','n','t','l','k','m','p','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];out+=initials[i]+medials[m]+finals[f]}return out}
    function say(text){if(!('speechSynthesis'in window)){alert('Korean audio is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.88;speechSynthesis.speak(u)}
    function detect(s){if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(s))return'ko';if(/[\u3400-\u9fff]/.test(s))return'zh-TW';return'en'}
    function langName(code){return code==='ko'?'Korean':code==='zh-TW'?'Chinese':'English'}
    async function translate(text,source,target){const key=[text,source,target].join('|');if(cache[key])return cache[key];const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(source+'|'+target);const response=await fetch(url);if(!response.ok)throw new Error('Translation service is unavailable. Please try again in a moment.');const data=await response.json();if(data.responseStatus!==200||!data.responseData?.translatedText)throw new Error(data.responseDetails||'No translation found. Try a shorter phrase.');const result=data.responseData.translatedText.replace(/&quot;/g,'"').replace(/&#39;/g,"'");cache[key]=result;return result}
    function setTab(next){tab=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='lookup'){headline.innerHTML='Find the words<br>you’re looking for.';subhead.textContent='Look up a Korean word, shape a translation, or ask why a sound changes.'}if(tab==='translate'){headline.innerHTML='Say it the way<br>you mean it.';subhead.textContent='Get natural options, with the right level of warmth and respect.'}if(tab==='questions'){headline.innerHTML='Make sense of<br>how Korean works.';subhead.textContent='Clear explanations for sound changes, grammar, and the little details.'}render()}
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    function render(){if(tab==='lookup')renderLookup();if(tab==='translate')renderTranslate();if(tab==='questions')renderQuestions()}
    function renderLookup(){view.innerHTML=`<section class="workspace"><p class="mode-label">Look up Korean</p><div class="entry"><textarea id="query" lang="ko" placeholder="Type a Korean word or sentence…" aria-label="Korean word or sentence"></textarea><div class="entry-bottom"><span class="hint">Hangul, one word or a full sentence</span><button class="primary" id="go">Look up <span aria-hidden="true">↗</span></button></div></div><div class="notice">Romanization is a simple reading aid. Connected Korean sounds can differ from spelling; tap ◖ to hear Korean speech from your device when available. For less common words, the app sends your text to MyMemory’s free public translation service.</div><div id="result" class="result"></div></section>`;const q=document.getElementById('query');q.value=lastText;document.getElementById('go').onclick=()=>lookup(q.value.trim());q.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')lookup(q.value.trim())})}
    async function lookup(text){lastText=text;const root=document.getElementById('result');if(!text){root.innerHTML='<div class="status">Enter a Korean word or sentence to get started.</div>';return}root.innerHTML='<div class="status">Finding a clear translation…</div>';const direct=bank[text];try{const english=direct?.meaning||await translate(text,'ko','en');const roman=direct?.roman||romanize(text);const examples=direct?.examples||[];root.innerHTML=`<article class="result-card"><div class="result-top"><div><div class="korean" lang="ko">${esc(text)}</div><div class="roman">${esc(roman)} · romanization</div></div><button class="audio" aria-label="Play Korean pronunciation" title="Play Korean pronunciation">◖</button></div><div class="meaning">${esc(english)}</div><div class="meta"><span class="pill">${direct?'Common word or phrase':'Translation reference'}</span><span class="pill">Korean → English</span></div>${examples.length?`<div class="section-title">In a sentence</div>${examples.map(x=>`<div class="example"><div class="ko" lang="ko">${esc(x[0])}</div><div class="en">${esc(x[1])}</div></div>`).join('')}`:`<div class="notice">For a full sentence, this is a translation reference rather than a dictionary definition. Word-by-word definitions and example sentences are available for common entries.</div>`}</article>`;root.querySelector('.audio').onclick=()=>say(text)}catch(e){root.innerHTML=`<div class="status error">${esc(e.message)}<br><span class="small">A network connection is needed for new translations. Common entries still work offline.</span></div>`}}
    function renderTranslate(){view.innerHTML=`<section class="workspace"><div class="toolbar"><p class="mode-label" style="margin:0">Translate a phrase</p><div class="seg" role="group" aria-label="Translation language"><button data-lang="en" class="${lang==='en'?'active':''}">English</button><button data-lang="zh-TW" class="${lang==='zh-TW'?'active':''}">中文</button></div></div><div class="entry"><textarea id="query" placeholder="Write in English, 中文, or 한국어…" aria-label="Text to translate"></textarea><div class="entry-bottom"><span class="hint">Korean direction is detected automatically</span><button class="primary" id="go">Translate <span aria-hidden="true">↗</span></button></div></div><div class="notice">The language button sets your preferred non-Korean language. Common phrases include natural formal and casual alternatives; other translations use MyMemory’s free public service and require internet. Text you submit is sent to that service.</div><div id="result" class="result"></div><div class="section-title">Try a phrase</div><div class="question-list"><button class="question-chip" data-example="I miss you">I miss you</button><button class="question-chip" data-example="Do you need help?">Do you need help?</button><button class="question-chip" data-example="Thank you">Thank you</button></div></section>`;const q=document.getElementById('query');q.value=lastText;document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;renderTranslate()});document.getElementById('go').onclick=()=>translateUI(q.value.trim());q.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')translateUI(q.value.trim())});document.querySelectorAll('.question-chip').forEach(b=>b.onclick=()=>{q.value=b.dataset.example;lastText=q.value;translateUI(q.value)})}
    function normalize(s){return s.toLowerCase().replace(/[?!.,。，！？]/g,'').trim()}
    async function translateUI(text){lastText=text;const root=document.getElementById('result');if(!text){root.innerHTML='<div class="status">Write a phrase in English, Chinese, or Korean to begin.</div>';return}const source=detect(text),target=source==='ko'?(lang==='zh-TW'?'zh-TW':'en'):'ko';root.innerHTML='<div class="status">Finding a natural translation…</div>';const known=phrases[normalize(text)];try{const baseline=known?null:await translate(text,source,target);if(target==='ko'){const cards=known||[{ko:baseline,roman:romanize(baseline),tag:'Natural translation',note:'A general translation. Korean wording changes with context, relationship, and formality.'}];root.innerHTML=`<article class="result-card"><div class="section-title" style="margin-top:0">${esc(langName(source))} → Korean</div><div class="korean" lang="ko">${esc(text)}</div><div class="options">${cards.map(c=>`<div class="option"><div class="option-head"><span class="option-title">${esc(c.tag)}</span><button class="audio" aria-label="Play Korean pronunciation" title="Play pronunciation">◖</button></div><div class="korean" lang="ko">${esc(c.ko)}</div><div class="roman">${esc(c.roman||romanize(c.ko))}</div><p>${esc(c.note)}</p></div>`).join('')}</div></article>`;root.querySelectorAll('.audio').forEach((b,i)=>b.onclick=()=>say(cards[i].ko))}else{root.innerHTML=`<article class="result-card"><div class="section-title" style="margin-top:0">Korean → ${esc(langName(target))}</div><div class="korean" lang="ko">${esc(text)}</div><div class="roman">${esc(romanize(text))} · romanization</div><div class="meaning">${esc(baseline)}</div><div class="meta"><span class="pill">General translation</span><span class="pill">${esc(langName(target))}</span></div><button class="audio" style="margin-top:16px" aria-label="Play Korean pronunciation">◖</button></article>`;root.querySelector('.audio').onclick=()=>say(text)}}catch(e){root.innerHTML=`<div class="status error">${esc(e.message)}<br><span class="small">Translations need an internet connection. Your phrase is sent to the free MyMemory translation service.</span></div>`}}
    const rules=[['Final consonants (받침)','A consonant at the bottom of a Hangul block is called batchim. At the end of a word, several batchim letters share one of seven basic ending sounds. The spelling still shows the original consonant.','옷 → [옫]  ·  옷 (ot), “clothes”'],['Sound carries to a vowel','When a word ending in a consonant is followed by a grammatical ending that starts with a silent ㅇ, the final sound often links into the next syllable. The letters remain written in their original blocks.','옷이 → [오시]  ·  osi, “clothes + subject marker”'],['Nasalization','Some final consonants change before ㄴ or ㅁ to make the transition easier to say.','국물 → [궁물]  ·  gungmul, “soup”'],['Tensification','A following plain consonant can become tense after certain final consonants. The spelling and sound may differ.','학교 → [학꾜]  ·  hakkyo, “school”'],['One spelling, connected speech','Korean spelling usually preserves a word’s underlying form even when connected pronunciation changes. This is a little like liaison as a listening comparison, but it does not mean a written syllable disappears.','읽어요 → [일거요]  ·  ilgeoyo, “I read / I’m reading”']];
    function renderQuestions(){view.innerHTML=`<section class="workspace"><p class="mode-label">How Korean sounds</p><div class="entry"><textarea id="question" placeholder="Ask about a Korean rule…" aria-label="Question about Korean"></textarea><div class="entry-bottom"><span class="hint">Or start with one of these sound changes</span><button class="primary" id="ask">Explain <span aria-hidden="true">↗</span></button></div></div><div id="answer" class="rule-list">${rules.slice(0,2).map(ruleCard).join('')}</div><div class="section-title">Explore a rule</div><div class="question-list">${rules.map((r,i)=>`<button class="question-chip" data-rule="${i}">${esc(r[0])}</button>`).join('')}</div><div class="notice">Use these as learning guides. Pronunciation can vary with word structure and speaking style; a dictionary or native speaker can help with an unusual example.</div></section>`;document.getElementById('ask').onclick=()=>answerQuestion(document.getElementById('question').value.trim());document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{document.getElementById('answer').innerHTML=ruleCard(rules[+b.dataset.rule])})}
    function ruleCard(r){return `<article class="rule"><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p><div class="rule-example" lang="ko">${esc(r[2])}</div></article>`}
    function answerQuestion(q){const box=document.getElementById('answer');if(!q){box.innerHTML='<div class="empty">Type a question or choose one of the rules below.</div>';return}const match=rules.find(r=>q.toLowerCase().includes(r[0].toLowerCase().split(' ')[0])||q.includes('liaison')||q.includes('연음'));box.innerHTML=match?ruleCard(match):`<article class="rule"><h3>A note about your question</h3><p>Korean pronunciation often changes across syllable boundaries while spelling stays the same. Try asking about batchim (받침), sound linking (연음), nasalization (비음화), or tensification (경음화).</p><div class="rule-example">Your question: ${esc(q)}</div></article>`}
    setTab('lookup');
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
